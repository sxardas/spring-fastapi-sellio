version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /service-spring
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(deps)
    groups:
      gradle-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /service-fastapi
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(deps)
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
